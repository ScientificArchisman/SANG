# The analog calibration (scripts/build_analog.py, sang.model.analog). Data settings come from the memory's generator
# config; these keys override it.
memory: runs/style/memory.pt     # its speakers and generator (mbes r4)
out: runs/style/analog.pt
sampler: g=2,steps=6             # the deployed sampler the statistics are for
footage_s: 30                    # footage read per clip, as HDTF's --demo 30
stride: 32                       # window starts, frames
max_windows: 16                  # per clip
draws: 2                         # noise draws per window and step (training and gate clips)
draws_own: 4                     # per footage window at test time
batch: 256                       # windows per pass
test_clips: 3                    # gate: test clips per val speaker
ranks: [2, 4, 6, 12]             # gate: the subspace rank, chosen on the even val speakers
lams: [0.0, 0.5, 1.0, 2.0, 4.0, 9.0, 19.0]   # gate: path-KL weight per mode
alphas: [0.25, 0.5, 0.75]        # gate: own-footage weight of own_matched / own_random
