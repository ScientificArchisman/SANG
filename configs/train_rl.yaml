# RL fine-tuning against the person critic (scripts/train_rl.py; docs/person_critic_plan.md stage 4). Data settings
# come from the generator run's own config; these keys override it.
gen: runs/demo/last.pt     # starting policy
critic: runs/critic_person/last.pt
out_dir: runs/rl3
rounds: 3                  # each fixes the KL reference, ends with EVAL + checkpoint + the stop check
alternations: 10           # per round: policy_steps, then critic_steps, this many times (RL v1: 1 x 500 + 500)
policy_steps: 25           # critic frozen, KL to the policy as it was when the round began
critic_steps: 25           # the critic refit on the new policy's samples
batch_size: 64
lr: 1.0e-5
critic_lr: 5.0e-5
weight_decay: 0.01         # critic refit only; the policy has none
kl: 1.0                    # path-KL weight: a velocity trust region for this deterministic sampler, not a true KL
w_real: 1.0                # reward = w_real * realism logit + w_sync * (sync logit - sync logit, audio shifted)
w_sync: 1.0
w_person: 1.0              # + w_person * (person logit with this person's footage - with another speaker's); 0 without one
g: 2.0                     # the policy is the guided sampler at beta = 1/g
steps: 6
p_clean: 0.25              # critic refit, as in configs/train_critic.yaml
p_demo: 0.2
shift_min: 3
shift_max: 15              # also the shifts of the sync contrast in the reward
gp: 10.0                   # R1 penalty in the critic refit
grad_clip: 1.0
bf16: true
workers: 8
log_every: 25
eval_batches: 8
