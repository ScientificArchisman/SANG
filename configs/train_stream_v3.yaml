data_glob: /beegfs/work_fast/shared/li_shared/archi_data/talkvid/clips/*/*.mp4
cache_dir: cache/v3_128_32768_ctx_wavlm
out_dir: runs/stream_v3
max_clips: 8000
windows_per_clip: 8
val_frac: 0.05
seed: 0
workers: 4

frames: 17
res: 128
fps: 25
codebook: 32768
audio_codebooks: 32          # mimi fallback only (unused with wavlm)
audio_encoder: wavlm-large   # cached WavLM features: 50 Hz, 1024-d (Hallo3/VASA-style speech repr)

model_type: streaming
motion_ctx: true             # grid = [identity ref, prev-window tail, content x5]
frame0_loss_weight: 0
bridge_init: true            # LeapTalk token-space bridge: content decoded by *editing* the identity ref, not from [MASK]
audio_lookahead: 4           # EMO-style future-audio window (4 WavLM ticks = 80ms) for lip pre-shaping

factorized_head: true
coupled_fsq_head: true       # autoregressive FSQ digits (joint token modeling)
learn_logit_scale: true

mask_schedule: mixed         # cosine + inference-shaped (suffix) masks
p_inference_shaped: 0.3      # fraction trained on the exact decode-time mask pattern
context_corrupt: 0.1         # corrupt visible ctx/motion context (exposure-bias / noisy-KV training)
audio_dropout: 0.1           # null-audio training for classifier-free guidance
audio_cfg: 2.0               # eval/demo guidance (LeapTalk ~1.6, Sonic 7.5; 2.0 safe midpoint — sweep later)

decode_steps: 12             # quality over latency
decode_temperature: 0.8
decode_gumbel: 4.5
decode_schedule: cosine

face_cond: true
cond_dropout: 0.2

# Perceptual losses (third_party/syncnet/stable_syncnet.pt)
syncnet_loss: true
trepa_loss: false     # DEAD: value ~0.0001, weight 0.05 -> no gradient, but costs a full VideoMAE fwd+bwd/step
syncnet_weight: 0.2   # was stuck at 0.65 on whole-lower-half crop; raise weight + rely on face_weight for focus
trepa_weight: 0.05
pixel_weight: 1.0     # pixel L1 on decoded frames (sharpness/realism)
face_weight: true     # LeapTalk W = 1 + M_face + 2*M_lip: focus pixel loss on the moving face, not static bg

resume: runs/stream_v3_161404/last.pt   # v3.1 furthest step (~24600); loss-only changes, shapes unchanged

dim: 512
layers: 8
heads: 8
dropout: 0.1

label_smoothing: 0.0
z_loss_weight: 0.0
fsq_loss_weight: 0.0

lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 300
max_steps: 120000
grad_clip: 1.0
batch_size: 1
grad_accum: 32           
eval_batch_size: 2

log_every: 50
eval_every: 1500
patience: 0
device: cuda
