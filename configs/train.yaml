# SANG — audio + reference image -> talking head.
# Primary track: Wan2.1 KL-VAE continuous latents at 256 px + rectified-flow head.
#
# FRESH run, not a resume: face cropping changes the cached pixels, the audio window changed
# length (Ta 33 -> 31), the bridge prior changed meaning and the flow head was rebuilt.
#
# Optional but recommended first (drops ~1/3 of clips with no/tiny/intermittent faces):
#   sbatch bash_scripts/job.sh scripts/filter_clips.py --out data/clips_filtered.txt
#   then set data_glob: data/clips_filtered.txt

# ---- data ----
data_glob: /beegfs/work_fast/shared/li_shared/archi_data/talkvid/clips/*/*.mp4
cache_dir: cache/face256_wan       # NEW dir: face_crop changes the cached pixels
out_dir: runs/face256_wan
max_clips: 12000                   # of 25,856 available (2,299 speakers). Cache build is CPU-bound
                                   # on face detection (~1.3 s/clip): 12k ~= 4-5 h one-off; 0 = all.
windows_per_clip: 8                # spread across the whole clip
val_frac: 0.05                     # split by SPEAKER, so val measures unseen identities
seed: 0
workers: 8

frames: 17                         # 0.64 s at 25 fps -> 5 latent slices, Ta = 31 WavLM ticks
res: 256                           # Wan VAE is 8x spatial -> 32x32 latent grid (r = 1024)
fps: 25
codebook: 32768                    # unused for content on this track; kept for shared code paths
audio_encoder: wavlm-large

# ---- representation ----
continuous: true                   # VAE latents + flow head instead of FSQ tokens + cross-entropy
z_ch: 16                           # Wan2.1 VAE latent channels
diff_hidden: 1024                  # MAR-style adaLN diffusion head
diff_depth: 6

# ---- the two changes that matter most ----
face_crop: true                    # detect + crop the face. Without it the mouth is ~1.6 latent
                                   # cells and no lip-sync is learnable. Needs mediapipe.
face_cond: false                   # the mesh is rendered from the TARGET frames: a ground-truth
                                   # lip-shape leak, absent at inference. Leaving it on makes the
                                   # model read the mesh and ignore the audio.

# ---- grid / conditioning ----
motion_ctx: true                   # grid = [identity ref, previous-window tail, content x5]
bridge_init: prev                  # content slice s starts from slice s-1 (teacher-forced in
                                   # training, the previous prediction at decode). "ref" collapses
                                   # every content slice to one embedding -> a static face.
audio_lookahead: 4                 # 80 ms of future audio; the mouth pre-shapes before the phoneme
audio_dropout: 0.1                 # null-audio training, enables classifier-free audio guidance

# ---- losses ----
syncnet_loss: true                 # on the one-step x0 estimate, decoded through the Wan VAE with
                                   # gradient. This is the only audio->lip supervision; without it
                                   # latent MSE alone rewards the blurry mean mouth.
syncnet_weight: 0.3
pixel_weight: 1.0
face_weight: true                  # W = 1 + M_face + 2*M_lip, geometry tuned for the face crop
perceptual_batch: 1                # examples per micro-batch decoded to pixels (memory peak).
                                   # First knob to lower on OOM; then set syncnet_loss: false.

# ---- model ----
dim: 512
layers: 8
heads: 8
dropout: 0.1

# ---- optimisation ----
bf16: true                         # ~2x throughput on H100; params stay fp32
lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 1000
max_steps: 50000
grad_clip: 1.0
batch_size: 4                      # for 80 GB cards (h100, a100_80gb). Measured: 25.1 GB peak at
                                   # batch 2 on a 40 GB a100 (gpu:a100 on gpu06 IS the 40 GB card that
                                   # OOM'd the v3 runs). On a 40 GB card use batch 2 / grad_accum 32.
                                   # On OOM: perceptual_batch first, then batch.
grad_accum: 16                     # effective batch 64
patience: 10                       # stop after 10 evals with no improvement

# ---- eval / decode ----
eval_every: 2000
eval_batch_size: 2
eval_max_batches: 32               # sequential decode = 5 backbone passes/window (x2 with CFG)
eval_with_struct: false
decode_steps: 12                   # Euler steps of the flow
bridge_t: 1.0                      # 1.0 = sample from noise; <1 anchors each slice on the reference
                                   # latent SDEdit-style (try 0.8 on demos once the run is healthy)
audio_cfg: 2.0                     # sweep 1.5-7.5 on demos afterwards

resume: ""
log_every: 50
device: cuda
