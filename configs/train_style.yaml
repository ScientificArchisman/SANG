# The style key and the style memory (scripts/train_style.py, sang.model.memory). Data settings come from the
# generator run's own config; these keys override it.
gen: runs/mbes/round4.pt   # the frozen generator whose residuals the key reads
out_dir: runs/style
key: residual              # residual = gen's mean from audio + real codes minus it; motion = the codes (ablation). No voice
dim: 256
out: 128
heads: 4
tau: 0.1
persons: 64                # batch = persons x K windows
K: 4
max_steps: 6000
warmup_steps: 300
lr: 3.0e-4
min_lr: 1.0e-5
weight_decay: 0.05
grad_clip: 1.0
bf16: true
workers: 8
log_every: 100
eval_every: 500
stride: 32                 # memory windows every 32 frames
audio_dims: 64             # principal directions of the mean WavLM tick in the audio key
