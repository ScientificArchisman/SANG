# Person critic (scripts/train_critic.py; docs/person_critic_plan.md stage 1). Data, latent, window and footage
# settings come from the generator run's own config; these keys override it.
gen: runs/demo/last.pt     # frozen generator: the critic's initial trunk and the source of its fakes
out_dir: runs/critic
gen_g: 2.0                 # the deployed sampler that makes the fakes
gen_steps: 6
p_clean: 0.25              # share of windows scored clean (t = 0, the reward); the rest at t ~ U(0, 1) (guidance)
p_demo: 0.2                # the critic's footage is dropped this often, so it also scores without footage
shift_min: 3               # sync fakes: the audio shifted by 3..15 frames (120..600 ms), either direction
shift_max: 15
gp: 10.0                   # R1 penalty on real windows, AMP's weight; 0 = runs/critic (saturated, research log §3.28)
lr: 1.0e-4
min_lr: 1.0e-5
warmup_steps: 200
max_steps: 4000
batch_size: 128
weight_decay: 0.01
grad_clip: 1.0
bf16: true
workers: 8
log_every: 50
eval_every: 500
eval_batches: 8
