# Continuous track: Wan2.1 KL-VAE latents + rectified-flow head at 256 px.
#
# Higher reconstruction ceiling than the discrete track (31.8 dB vs 25.3 dB measured on
# blind centre crops) and no quantisation error, but 4x the sequence length (r=1024 vs 256)
# and an untested flow head. Run configs/train.yaml first for a clean baseline; measure the
# face-cropped ceiling of both with:
#     sbatch bash_scripts/job.sh scripts/ceiling.py --n 32
#
# Only the keys that differ from configs/train.yaml are commented.
data_glob: /beegfs/work_fast/shared/li_shared/archi_data/talkvid/clips/*/*.mp4
cache_dir: cache/face256_wan
out_dir: runs/face256_wan
max_clips: 0
windows_per_clip: 8
val_frac: 0.05
seed: 0
workers: 8

frames: 17
res: 256                  # Wan VAE is 8x spatial -> 32x32 latent grid
fps: 25
codebook: 32768           # unused for content; kept for shared code paths
audio_encoder: wavlm-large

continuous: true          # latents + flow head instead of FSQ tokens + cross-entropy
z_ch: 16                  # Wan2.1 VAE latent channels
diff_depth: 3

face_crop: true
face_cond: false
motion_ctx: true
bridge_init: prev
audio_lookahead: 4
context_corrupt: 0.1
audio_dropout: 0.1

syncnet_loss: false       # enable once the flow head produces a recognisable face
syncnet_weight: 0.3
pixel_weight: 0.0
face_weight: true

dim: 512
layers: 8
heads: 8
dropout: 0.1

bf16: true
lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 1000
max_steps: 50000
grad_clip: 1.0
batch_size: 2             # r=1024 -> L=7168; 4x the attention cost of the discrete track
grad_accum: 32            # effective batch 64
patience: 10

eval_every: 2000
eval_batch_size: 2
eval_max_batches: 64
eval_with_struct: false
decode_steps: 12
audio_cfg: 2.0

resume: ""
log_every: 50
device: cuda
