# Proper multi-sample fine-tuning of the 6-step sampler (scripts/train_set.py; reports/SANG RL for video realism.md).
# Data settings come from the generator run's own config; these keys override it. Default = idea 2 on the codes.
gen: runs/demo/last.pt     # starting policy
out_dir: runs/set
rounds: 6                  # each fixes the KL reference, ends with EVAL + checkpoint + the stop check
alternations: 10           # per round: policy_steps (then critic_steps with w_adv), this many times
policy_steps: 25
critic_steps: 25           # w_adv > 0 only: the set critic refit on the new policy's samples
critic_warmup: 500         # w_adv > 0 only: set-critic steps against the starting policy before round 0's EVAL
persons: 8                 # batch = persons x K windows x m samples = 64 rollouts
K: 8                       # windows per person (1 = idea 1)
m: 1                       # samples per window (idea 1: 8)
w_set: 1.0                 # energy distance on the codes
score: es                  # es = the energy distance on the codes; mbes (K = 1) = the multiscale-block score
w_adv: 0.0                 # + the same in the set critic's learned space
kl: 1.0                    # path-KL weight: a velocity trust region to the round's start
lr: 1.0e-5
critic_lr: 5.0e-5
weight_decay: 0.01         # critic only
gp: 10.0                   # set critic R1 (feature Jacobian at real windows)
g: 2.0                     # the policy is the guided sampler at beta = 1/g
steps: 6
grad_clip: 1.0
bf16: true
workers: 8
log_every: 25
eval_batches: 8            # 8 persons x 8 windows x 8 samples each for the set EVAL
